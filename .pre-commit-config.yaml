repos:
  # PRETTIER OWNS THE LOGBOOK'S MARKDOWN AND NOT THE RFDS.
  #
  # It formatted every markdown file in `weftspun/logbook`, and `types:
  # [markdown]` alone would now reach 250 RFD READMEs and DETAILS that were
  # never prettier-formatted. RFD 1063 moved prose enforcement here to the STE
  # plugin, so a reflow of all of them is a diff nobody asked for -- and a
  # rewrapped README can cross RFD 1000's 40-line limit, which would fail a
  # different gate for a reason that has nothing to do with what changed.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [markdown]
        files: '^([^/]+\.md|scripts/README\.md)$'

  # RFD 1035 makes OpenUSD the internal format, so a layer that other tools reject is a
  # layer that is not written yet. `rfd1122-plan.usda` opened in Python, composed without
  # error and read back its ten tasks while still failing usdchecker's rules for want of
  # an `upAxis` -- "it opens" is not "it is valid", and only a gate tells them apart.
  #
  # `usd-core` is pinned rather than floated: the validator set is what decides pass or
  # fail here, and a version bump that adds a rule should arrive as a diff somebody
  # approves rather than as a red run on an unrelated pull request.
  - repo: local
    hooks:
      # `pen-66606.usda` IS EXCLUDED, AND THE EXCLUSION IS NAMED RATHER THAN SILENT.
      #
      # It sublayers each manual site's own register, and the sites are separate
      # repositories. A checkout of this repository alone cannot resolve
      # `../multiplayer-fabric-manuals/SERIALS.usda`, so usdchecker reports an
      # unresolvable external dependency for a layer that is correct in the workspace
      # it was written for. Excluding it here would be a silent skip if nothing else
      # read it, so `check_pen_66606.py` does, at the manual stage, where a `repo`
      # workspace exists. That gate is stricter than this one about the same file.
      - id: usd-valid
        name: USD layers parse, validate and round-trip through crate
        entry: python scripts/check_usd_valid.py
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: \.usd[acz]?$
        exclude: ^pen-66606\.usda$
        pass_filenames: true

      # A hand-written index of the files beside it is a second copy of `ls`, and the two
      # disagree the first time somebody adds a file and forgets the table. Nothing reports
      # that, which is the same shape as every other second-place-a-fact-lives rule here.
      # The provocation was an agent adding two rows for files it had just written: accurate
      # that afternoon, unpoliced afterwards. This gate would have rejected them.
      #
      # `markdown-it-py` is declared because the gate parses the CommonMark token stream
      # rather than matching pipes at the start of a line. The first version did the latter
      # and read `foot.R`, an ANNY bone in a residual table, as a filename. A hook whose
      # dependency is undeclared fails in CI with a ModuleNotFoundError, which is how this
      # line came to be written.
      - id: readme-no-index
        name: README.md indexes no files -- the directory is the index
        entry: python scripts/check_readme_no_index.py
        language: python
        additional_dependencies: ["markdown-it-py==3.0.0"]
        files: ^README\.md$
        pass_filenames: true

      # The plan's numbering must agree with its own graph, and its counts with the
      # documents they came from -- and one of those documents is RFD 1122, which lives in
      # `request-for-discussion` rather than here. CI checks this repository out on its
      # own, so the RFD is simply absent there and the check cannot run.
      #
      # `stages: [manual]` rather than a skip inside the script, because the two read
      # differently. A script that notices a missing source and passes anyway reports a
      # green run for a check it did not perform; a manual hook reports nothing and says
      # where to run it. In a goal-manifest workspace:
      #
      #     prek run rfd1122-plan --hook-stage manual --all-files
      - id: rfd1122-plan
        name: RFD 1122's plan agrees with its graph and with the RFD
        entry: python scripts/check_rfd1122_plan.py
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: ^(rfd1122-plan\.usda|scripts/check_rfd1122_plan\.py|CLAUDE\.md)$
        pass_filenames: false
        stages: [manual]

      # The four loops are described twice on purpose: `fourloops-plan.usda` is the task
      # graph and `fourloops-etnf.usda` is the schema those tasks read and write. Two
      # documents about one thing drift, and neither drift appears in a diff of the file
      # being edited, because the other file is the one that changed.
      #
      # `stages: [manual]` for the same reason as `rfd1122-plan` above: both gates read the
      # sources their layers name, and those sources sit in `6-datasource`, `3-interactor`
      # and `7-service`. CI checks this repository out on its own, so the sources are simply
      # absent there. A script that notices a missing source and passes anyway reports a
      # green run for a check it did not perform. In a goal-manifest workspace:
      #
      #     prek run fourloops-plan --hook-stage manual --all-files
      #     prek run fourloops-etnf --hook-stage manual --all-files
      - id: fourloops-plan
        name: the four-loop plan agrees with its graph, its sources and the schema layer
        entry: python scripts/check_fourloops_plan.py
        language: system
        files: ^(apparatus/1143-keypoints-to-anny/fourloops-(plan|etnf)\.usda|scripts/check_fourloops_plan\.py)$
        pass_filenames: false
        stages: [manual]

      # A relationship target that names no prim composes without complaint, and neither
      # `usdchecker` nor `check_usd_valid.py` reports it. That is the hole this gate covers,
      # along with the ETNF rules the layer argues for and could violate itself: a derivable
      # column stored anyway, and an emitted relation no stage writes. The second found
      # `ArmUnavailable`, described in the layer and written by nothing.
      - id: fourloops-etnf
        name: the ETNF schema resolves, stores nothing derivable, and has a writer each
        entry: python scripts/check_fourloops_etnf.py
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: ^(apparatus/1143-keypoints-to-anny/fourloops-etnf\.usda|scripts/check_fourloops_etnf\.py)$
        pass_filenames: false
        stages: [manual]

      # A sublayer that does not resolve composes to nothing, and USD reports it as a
      # warning rather than an error. Two sites authoring one serial compose to one row,
      # which reads exactly like agreement. Both are invisible to the stage and both are
      # what this gate exists for.
      - id: pen-66606
        name: every site owns its own serials and no two sites author one
        entry: python scripts/check_pen_66606.py
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: ^(pen-66606\.usda|scripts/check_pen_66606\.py)$
        pass_filenames: false
        stages: [manual]

      # The controls for both, which need no workspace: each builds its own layer in a
      # temporary directory. Half of them must FAIL on known-broken input, because a check
      # that cannot fail certifies the defect. These run on every commit that touches a
      # gate, which is what makes the manual hooks above worth having.
      - id: fourloops-plan-self-test
        name: the four-loop plan gate still fails on a plan that contradicts itself
        entry: python scripts/check_fourloops_plan.py --self-test
        language: system
        files: ^scripts/check_fourloops_plan\.py$
        pass_filenames: false

      - id: fourloops-etnf-self-test
        name: the ETNF gate still fails on a dangling target and a stored derivable column
        entry: python scripts/check_fourloops_etnf.py --self-test
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: ^scripts/check_fourloops_etnf\.py$
        pass_filenames: false

      - id: pen-66606-self-test
        name: the PEN gate still fails on an unresolved sublayer and a shared serial
        entry: python scripts/check_pen_66606.py --self-test
        language: python
        additional_dependencies: ["usd-core==26.8"]
        files: ^scripts/check_pen_66606\.py$
        pass_filenames: false

      # A comparison joined twice -- "five soda cans along the axis and against three across it"
      # -- reads past a first pass and shipped in `check_view_selection.py`. The two prose
      # gates beside this one, `check_household_units.exs` and `check_prose_tropes.exs`, are
      # not wired here and are run by hand; that is how the defect reached a committed file, so
      # this one is wired.
      #
      # `language: system` because the gate is a script rather than a package: it needs elixir
      # on PATH and nothing else, and the CI job installs it with `erlef/setup-beam`. A hook
      # that silently passes where its interpreter is absent would certify every file it could
      # not read, so the missing binary is left to fail loudly.
      - id: double-join
        name: no comparison is joined twice
        entry: elixir scripts/check_double_join.exs --file
        language: system
        types_or: [markdown, python, text]
        pass_filenames: true

      # The gate's own controls, run whenever the gate changes. Half of them must FAIL on
      # known-broken input, because a check that cannot fail certifies the defect.
      - id: double-join-self-test
        name: the double-join gate still fails on known-broken prose
        entry: elixir scripts/check_double_join.exs --self-test
        language: system
        files: ^scripts/check_double_join\.exs$
        pass_filenames: false

      # CLAUDE.md was 972 lines, 592 of them the argument behind the blocklist table. The
      # reasoning moved to BLOCKLIST.md so a reader looking up whether a source is permitted
      # is not walking through the case against FLUX.1 to reach the next agreement.
      #
      # Splitting a document invents a way for it to go wrong: a row can promise "see below"
      # with nothing below, or an argument can outlive the row it defends. Neither appears in
      # a diff of the file being edited, because the other file is the one that changed.
      - id: blocklist-detail
        name: every blocklist row has its argument, and every argument its row
        entry: python scripts/check_blocklist_detail.py
        additional_dependencies: ["markdown-it-py==3.0.0"]
        language: python
        files: ^(CLAUDE\.md|BLOCKLIST\.md|scripts/check_blocklist_detail\.py)$
        pass_filenames: false

      - id: blocklist-detail-self-test
        name: the blocklist-detail gate still fails on a row with no argument
        entry: python scripts/check_blocklist_detail.py --self-test
        additional_dependencies: ["markdown-it-py==3.0.0"]
        language: python
        files: ^scripts/check_blocklist_detail\.py$
        pass_filenames: false

      # CLAUDE.md's comment rule, gated. It held nothing for as long as it took to
      # write it down, and `check_comment_density.py` beside it is aimed at other
      # people's repositories: C and C++ only, peers drawn from the repo being edited.
      #
      # STAGED CHANGES ARE WHAT THIS SEES. The gate diffs against HEAD, so a local
      # commit is judged and `prek run --all-files` in CI is not -- nothing is staged
      # there and the gate would report a green run for a check it did not perform.
      # The `comment-ladder` job in checks.yml passes `--base origin/<base>` for that
      # reason, the way `rfd-serials` already does.
      - id: comment-ladder
        name: no changed source file climbs the comment-density ladder
        entry: python scripts/check_comment_ladder.py
        language: system
        files: \.(py|ex|exs)$
        pass_filenames: false

      - id: comment-ladder-self-test
        name: the ladder still rejects padding, a deletion past the rung, and a new file above entry
        entry: python scripts/check_comment_ladder.py --self-test
        language: system
        files: ^scripts/(check_comment_ladder|comment_density)\.py$
        pass_filenames: false

      # Trope density does not rise. The script's diff mode uses `base...HEAD`
      # (triple-dot), which is empty on a local commit, so the hook runs the
      # report mode and the self-test twin below is what proves the gate
      # still fires on planted-broken input.
      - id: trope-density
        name: trope density (report mode; self-test does the gating)
        entry: python scripts/check_tropes.py
        additional_dependencies: ["markdown-it-py==3.0.0"]
        language: python
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|rfd/[^/]+/(README|DETAILS)\.md|logbook/.*\.md|scripts/check_tropes\.py)$'
        pass_filenames: false

      - id: trope-density-self-test
        name: the trope-density gate still fails on planted-broken prose
        entry: python scripts/check_tropes.py --self-test
        additional_dependencies: ["markdown-it-py==3.0.0"]
        language: python
        files: ^scripts/check_tropes\.py$
        pass_filenames: false

      # THE M&M'S CLAUSE. A new RFD README that ships without the canary sentence is one
      # an AI drafted from a session that skipped `CLAUDE.md`. The self-test is what
      # makes the gate worth having; the run itself is a manual stage, because the
      # base-branch diff has no useful meaning on a local commit.
      - id: rfd-canary
        name: every new RFD carries the drafting canary
        entry: python scripts/check_rfd_canary.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: rfd-canary-self-test
        name: the canary gate still fails on a new RFD without the sentence
        entry: python scripts/check_rfd_canary.py --self-test
        language: system
        files: ^scripts/check_rfd_canary\.py$
        pass_filenames: false

  # THE RFD HOOKS, FROM THE OTHER HALF OF THIS REPOSITORY.
  #
  # `weftspun/logbook` and `weftspun/request-for-discussion` were two repositories and
  # are one. Two configurations became this file, and the two `repo: local` blocks are
  # kept apart rather than interleaved, because a hook's neighbours are how a reader
  # finds the rest of the set it belongs to.
  #
  # Runs with prek, which reads the pre-commit config format.
  #
  #   prek install
  #   prek run --all-files
  #
  # Moved here from weftspun-3d-studio's own .pre-commit-config.yaml
  # when decisions/ itself moved to this repository. The Elixir hooks
  # cover the RECTGTN HTN domains and problems that sit beside their
  # RFDs (RFD 1037 records why those files are Elixir DSL); the
  # dockerfile-and-server hook covers the model-image build sources
  # that sit beside theirs (RFD 1036 gives the rules).
  - repo: local
    hooks:
      - id: mix-format
        name: mix format (taskweft domains)
        description: >-
          Formats */*.ex against .formatter.exs. A domain is real
          Elixir, thus the formatter is the first check it passes.
        entry: mix format --check-formatted
        language: system
        files: '^([0-9]{4}-.*\.exs?|rfd/[0-9]{4}-[^/]+\.exs|SERIALS[^/]*\.exs|lib/.*|test/.*|mix\.exs)$'
        pass_filenames: false

      # RFD 2232: every RFD is rfd/NNNN-slug.exs and every register is SERIALS*.exs;
      # the Markdown and the .usda are rendered from them and untracked, so the hooks
      # below that read the tree read a fresh rendering.
      - id: rfd-dsl-render
        name: render the RFD and register sources
        entry: mix rfd.render
        language: system
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|SERIALS[^/]*\.exs|lib/.*|test/.*|mix\.exs)$'
        pass_filenames: false

      - id: rfd-dsl-check
        name: every RFD and register source compiles inside RFD 1000's shape
        entry: mix rfd.check
        language: system
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|SERIALS[^/]*\.exs|lib/.*|test/.*|mix\.exs)$'
        pass_filenames: false

      - id: rfd-dsl-serials
        name: the registers agree with the sources on disk
        entry: mix rfd.serials
        language: system
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|SERIALS[^/]*\.exs|lib/.*|test/.*|mix\.exs)$'
        pass_filenames: false

      # The DSL's own controls: six known-broken documents must be refused.
      - id: rfd-dsl-test
        name: the RFD DSL still refuses known-broken documents
        entry: mix test
        language: system
        files: '^(lib/.*|test/.*|mix\.exs)$'
        pass_filenames: false

      - id: elixir-parses
        name: elixir parses (taskweft domains)
        description: >-
          Rejects a domain that is not valid Elixir. The formatter
          catches this as well, and this hook names the failure.
        entry: elixir scripts/check-elixir-parses.exs
        language: system
        files: '^[0-9]{4}-.*\.exs?$'

      - id: rfd-structure
        name: rfd structure (commonmark)
        description: >-
          Checks each RFD against the shape the corpus already uses:
          the title, the State/Feature/Scope preamble, the section
          spine, and every RFD citation. It reads a CommonMark AST,
          so a citation wrapped over two lines is one citation.
          RFD 1124 gives the rules and how each was measured.
        entry: python scripts/check-rfd-structure.py
        language: python
        additional_dependencies: [markdown-it-py==3.0.0, usd-core==26.8]
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|rfd/[0-9]{4}-[^/]+/(README|DETAILS)\.md|apparatus/[0-9]{4}-[^/]+/SKILL\.md)$'
        pass_filenames: false

      # RFD 1000 owns numbering. The script scans the tree rather than a
      # diff, so `pass_filenames: false` and a `files:` guard that catches
      # both an RFD directory change and an edit to the gate itself.
      - id: rfd-numbers
        name: rfd numbers (organization-qualified decimals)
        description: >-
          Every RFD directory is four decimal digits, begins with the org
          digit, is unique, and agrees with its README's H1. RFD 1000
          gives the rule.
        entry: python scripts/check-rfd-numbers.py
        language: python
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|[0-9]{4}-.*|scripts/check-rfd-numbers\.py)$'
        pass_filenames: false

      - id: rfd-numbers-self-test
        name: the rfd-numbers gate still fails on planted-broken numbering
        entry: python scripts/check-rfd-numbers.py --self-test
        language: python
        files: ^scripts/check-rfd-numbers\.py$
        pass_filenames: false

      - id: rfd-serials
        name: rfd serials (the register)
        description: >-
          Holds SERIALS.usda against the tree, and against its own
          last revision. A renumbering removes serials, so it fails
          there. RFD 1000 gives the rule.
        entry: python scripts/check-rfd-serials.py
        language: python
        additional_dependencies: [usd-core==26.8]
        files: '^(rfd/[0-9]{4}-[^/]+\.exs|SERIALS[^/]*\.exs|[0-9]{4}-.*|SERIALS\.usda)$'
        pass_filenames: false

      - id: dockerfile-and-server
        name: model images parse
        description: >-
          Each model folder carries a Dockerfile and a server.py.
          RFD 1036 gives the rules, and a broken server.py fails much
          later, on a rented GPU.
        entry: python scripts/check-model-images.py
        language: system
        files: '^apparatus/[0-9]{4}-[^/]+/(Dockerfile|server\.py|test_input\.json)$'

  # Markdown hygiene. Structural only, deliberately.
  #
  # RFD 1063 moves ASD-STE100 enforcement to the simplified-technical-english
  # plugin, and says why no repository-local script duplicates it. These hooks
  # therefore check nothing about the prose. They check the bytes: a trailing
  # space that a diff shows and a reader cannot see, a missing final newline
  # that makes the next commit touch a line nobody edited, and a CRLF that
  # arrives from a Windows checkout and rewrites a whole file.
  #
  # Scoped to markdown. The Elixir and model-image hooks above own their own
  # file types, and a hook that reformats somebody else's is a hook that
  # widens without being asked.


      - id: asset-prefix
        name: asset filenames carry a typed prefix and PascalCase name
        entry: python scripts/check_asset_prefix.py
        language: python
        pass_filenames: true
        files: ^(5-repository|6-datasource)/.*\.(png|jpg|jpeg|webp|exr|json|yaml|yml|glb|gltf|fbx|obj|wav|ogg|mp3|usdz|usdc)$

      - id: asset-prefix-self-test
        name: the asset-prefix gate still fires on planted-broken names
        entry: python scripts/check_asset_prefix.py --self-test
        language: python
        pass_filenames: false
        always_run: true

      # RFD 2188: one canonical ggml under 2-contract/ggml. A consumer bringing
      # its own copy fails this gate. The two llama.cpp checkouts are exempt
      # (vendor runtime, per CLAUDE.md's ggml row). Manual stage until Phase 2
      # migrates the remaining consumers, so the framework can land without CI
      # blocking on the drift it exists to remove.
      - id: ggml-singleton
        name: one canonical ggml source tree under 2-contract/ggml
        entry: python scripts/check_ggml_singleton.py
        language: python
        stages: [manual]
        pass_filenames: false
        always_run: true

      - id: ggml-singleton-self-test
        name: the ggml-singleton gate still fails on a planted rogue ggml.h
        entry: python scripts/check_ggml_singleton.py --self-test
        language: python
        files: ^scripts/check_ggml_singleton\.py$
        pass_filenames: false

      # A directory that carries DETAILS.md without a README.md has no page;
      # the DSL renders both, so this now guards the apparatus directories.
      - id: rfd-readme-present
        name: every RFD dir with DETAILS.md carries a README.md
        entry: python scripts/check_rfd_readme_present.py
        language: python
        pass_filenames: false
        always_run: true

      # rm -rf rfd/*/ should cost a render and nothing else. It cost 65 tracked
      # files on 2026-09-07, so the invariant is a gate rather than a habit.
      - id: rfd-dirs-rendered-only
        name: nothing tracked lives under rfd/NNNN-slug/
        entry: python scripts/check_rfd_dirs_rendered_only.py
        language: system
        pass_filenames: false
        always_run: true

      - id: rfd-dirs-rendered-only-self-test
        name: the rfd-dirs-rendered-only gate still fails on a planted apparatus file
        entry: python scripts/check_rfd_dirs_rendered_only.py --self-test
        language: system
        files: ^scripts/check_rfd_dirs_rendered_only\.py$
        pass_filenames: false

      - id: rfd-readme-present-self-test
        name: the rfd-readme-present gate still fails on a planted DETAILS-only dir
        entry: python scripts/check_rfd_readme_present.py --self-test
        language: python
        files: ^scripts/check_rfd_readme_present\.py$
        pass_filenames: false

      # State must be one of the seven canonical values RFD 1000 lists. A
      # parenthetical annotation after the value ("discussion (implemented ...)")
      # is neither canonical nor parseable by strict tooling; four RFDs on
      # 2026-09-03 carried that shape.
      - id: rfd-state-canonical
        name: every RFD README State is a canonical value from RFD 1000
        entry: python scripts/check_rfd_state_canonical.py
        language: python
        pass_filenames: false
        always_run: true

      - id: rfd-state-canonical-self-test
        name: the rfd-state-canonical gate still fails on a planted parenthetical
        entry: python scripts/check_rfd_state_canonical.py --self-test
        language: python
        files: ^scripts/check_rfd_state_canonical\.py$
        pass_filenames: false

      # DUAL-TRACK PARITY WITH transport-shepherd's ELIXIR GATE PORTS.
      #
      # Task #83 landed 17 bucket-A gate ports in weftspun/transport-shepherd
      # (PR#1..#16). Operator picked "dual-track for one week" on the flip
      # question, so both implementations of each gate run alongside their
      # python original during the window and the operator sees any drift.
      #
      # AGGREGATE HOOK RATHER THAN 17. One BEAM startup instead of seventeen
      # is the wall-time win; the per-gate breakdown is what
      # `scripts/run_shepherd_gates.py`'s output already prints. Adding or
      # removing a gate is a dispatcher-level edit in shepherd, not a
      # `.pre-commit-config.yaml` diff here.
      #
      # SKIP IS NAMED, NOT SILENT (rule 3). The wrapper walks up looking for
      # `1-transport/transport-shepherd/mix.exs`, or reads `SHEPHERD_ROOT`,
      # and prints a named skip when neither shepherd nor `mix` is available.
      # A missing toolchain reports a skip line, not a green pass.
      #
      # comment-density drift is documented in the shepherd PR#14 body: the
      # Elixir line-toggle docstring detection over-counts non-docstring
      # triple-quoted literals, so its baseline numbers diverge from the
      # Python original on non-fixture code. The gate itself compares
      # before/after with the same Elixir function, so the ladder decision
      # is drift-tolerant by construction. This dual-track hook is running
      # each gate's `--self-test`, which is drift-free; measurement drift
      # only surfaces on live-repo baseline invocations, not here.
      - id: all-shepherd-gates
        name: shepherd's gate ports still fire (dual-track parity, one week)
        entry: python scripts/run_shepherd_gates.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: '\.md$'
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        files: '\.md$'
      - id: mixed-line-ending
        files: '\.md$'
        args: [--fix=lf]
