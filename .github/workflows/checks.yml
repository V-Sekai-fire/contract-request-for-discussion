name: Checks

on:
  pull_request:
  merge_group:
  # A push to main is the "just-merged" edge, which is where the
  # orphan-branch gate has something new to look at. Every other job in
  # this file guards itself with an `if:` for the trigger it wants.
  push:
    branches: [main/main]
  schedule:
    # Nightly sweep for orphans, so a branch pushed to after its merge
    # gets caught the next day rather than at the next unrelated push.
    - cron: "17 5 * * *"

concurrency:
  # One CI run per branch. A pull_request synchronize, a merge_group
  # entry, and a push to that branch all share the same group, and the
  # newer one cancels any earlier still running.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # prek is the only job: every gate is a hook in `.pre-commit-config.yaml`.
  # The ci-* hooks sit in the manual stage because they need GATE_BASE or
  # GH_TOKEN, which a local commit does not have.
  prek:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Diff-based hooks read the base revision; a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # The double-join hook is `language: system` and shells out to elixir, so the runner
      # needs a BEAM before prek starts. Pinned rather than floated for the same reason
      # `usd-core` is: a toolchain bump should arrive as a diff somebody approves.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      # jose 1.11.12 (via ex_mcp) uses bare `catch`, deprecated in OTP 29. Silence it for
      # that exact tuple only, so any version change brings the warnings back.
      - name: silence jose's bare catch for jose 1.11.12, OTP 29, Elixir 1.20.4 only
        run: |
          jose=$(grep -o '"jose": {:hex, :jose, "[^"]*"' mix.lock | cut -d'"' -f4)
          otp=$(erl -noshell -eval 'io:put_chars(erlang:system_info(otp_release)), halt().')
          ex=$(elixir -e 'IO.write(System.version())')
          if [ "$jose/$otp/$ex" = "1.11.12/29/1.20.4" ]; then
            echo 'ERL_COMPILER_OPTIONS=[nowarn_deprecated_catch]' >> "$GITHUB_ENV"
          else
            echo "::notice::jose/OTP/Elixir is $jose/$otp/$ex, not 1.11.12/29/1.20.4; bare-catch warnings stay on"
          fi
      # DUAL-TRACK WITH transport-shepherd. Task #83 landed 17 Elixir gate ports;
      # the `all-shepherd-gates` prek hook shells to `mix gates <name> --self-test`
      # for each. The CI runner has no goal-manifest checkout, so shepherd is
      # cloned separately here and SHEPHERD_ROOT points the wrapper at it. Skip
      # is loud (rule 3) when either half is missing.
      - name: check out transport-shepherd (dual-track)
        uses: actions/checkout@v5
        with:
          repository: weftspun/transport-shepherd
          path: transport-shepherd
      - name: install shepherd deps
        working-directory: transport-shepherd
        run: mix deps.get
      - run: pip install prek
      # The Markdown and the registers are rendered from the .exs sources (RFD 2232).
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
      - run: mix rfd.render
      # GH_TOKEN passthrough for the shepherd goal-manifests port, which asks the
      # organisation which repos are archived (same reason the goal-manifests
      # python job below carries it). Without it the shepherd hook reports FAIL
      # UNCHECKED per rule 3 rather than a silent skip.
      - env:
          SHEPHERD_ROOT: ${{ github.workspace }}/transport-shepherd
          GH_TOKEN: ${{ github.token }}
        run: prek run --all-files --show-diff-on-failure --color always
      - run: pip install -r scripts/requirements.txt
      - env:
          GATE_BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          prek run --all-files --hook-stage manual --show-diff-on-failure --color always
          ci-rfd-serials ci-rfd-structure ci-comment-ladder ci-line-length ci-trope-density
          ci-rfd-canary ci-spdx ci-goal-manifests ci-rulesets
